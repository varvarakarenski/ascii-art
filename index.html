<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css">
        <meta charset="utf-8">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='29 -1054 1207 1207'><path transform='scale(1,-1)' d='M799 0V48Q722 7 629 -14Q536 -34 460 -34Q295 -34 192 54Q89 141 89 247Q89 376 220 486Q352 597 584 597Q677 597 799 577V626Q799 672 760 701Q720 730 609 730Q518 730 373 694Q319 681 289 681Q248 681 220 710Q191 740 191 786Q191 812 201 831Q211 850 229 862Q247 873 304 889Q380 910 459 922Q538 935 602 935Q793 935 898 852Q1004 770 1004 627V205H1039Q1113 205 1144 176Q1176 148 1176 102Q1176 57 1144 28Q1113 0 1039 0ZM799 367Q676 391 572 391Q447 391 357 330Q301 291 301 251Q301 222 328 204Q378 171 465 171Q539 171 632 200Q726 229 799 279Z'/></svg>">
    </head>
    <body>
        <h1>ASCII Banner Maker</h1>
        <p>Upload an image and convert it to ASCII text art!</p>
        <div class="toggles">
            <form id="uploadForm">
                <label class="button">Choose file: <input type="file" id="fileInput" name="myFile"></label>
                <button class = "button" type="submit">Submit</button>
            </form>
            <span class="toggle-label">White</span>
            <label class="toggle-switch">
                <input type="checkbox" id="bgToggle" aria-label="Black background">
                <span class="slider"></span>
            </label>
            <span class="toggle-label">Black</span>
            <label class="toggle-label" for="pixelSlider">Pixel size</label>
            <input type="range" id="pixelSlider" min="4" max="30" value="10">
        </div>
    
        <div id="output">
            <button class="button" id="copyBtn">Copy</button>
            <button class="button" id="saveBtn">Save image</button>
            <pre id="asciiOutput"></pre>
        </div>
        <footer>
            <a href="https://github.com/varvarakarenski/ascii-art">GitHub</a>
        </footer>
        <script>
            const form = document.getElementById('uploadForm');

            form.addEventListener('submit', async (e) => {
                e.preventDefault(); 

                const fileInput = document.getElementById('fileInput');
                const file = fileInput.files[0];
                if (!file) return;

                const url = URL.createObjectURL(file);
                loadImage(url, img => renderAscii(img));

            });

            const copyBtn = document.getElementById('copyBtn');
            copyBtn.addEventListener('click', async () => {
                await navigator.clipboard.writeText(document.getElementById('asciiOutput').textContent);
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = 'Copy', 1500);
            });

            document.getElementById('saveBtn').addEventListener('click', () => {
                const pre = document.getElementById('asciiOutput');
                const style = getComputedStyle(pre);
                const box = getComputedStyle(document.getElementById('output'));
                const lineH = parseFloat(style.lineHeight);
                const k = 2;
                const canvas = document.createElement('canvas');
                canvas.width = pre.offsetWidth * k;
                canvas.height = pre.offsetHeight * k;
                const ctx = canvas.getContext('2d');
                ctx.scale(k, k);
                ctx.fillStyle = box.backgroundColor;
                ctx.fillRect(0, 0, pre.offsetWidth, pre.offsetHeight);
                ctx.fillStyle = box.color;
                ctx.font = `${style.fontSize} ${style.fontFamily}`;
                ctx.textBaseline = 'middle';
                pre.textContent.split('\n').forEach((line, i) => ctx.fillText(line, 0, (i + 0.5) * lineH));

                const a = document.createElement('a');
                a.download = 'ascii-art.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            });
        </script>
        <script src="sketch.js">

        </script>
    </body>

</html>
